    <circle cx="37" cy="232" r="46" fill="url(#tree1Grad)"/>
    <circle cx="18" cy="248" r="30" fill="url(#tree2Grad)"/>
    <circle cx="60" cy="244" r="32" fill="url(#tree1Grad)"/>
    <rect x="100" y="265" width="16" height="55" fill="#7a5235"/>
    <circle cx="108" cy="238" r="38" fill="url(#tree1Grad)"/>
    <circle cx="88" cy="252" r="25" fill="url(#tree2Grad)"/>
