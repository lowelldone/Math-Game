    <circle cx="120" cy="396" r="7" fill="#6699ff"/>
    <circle cx="120" cy="396" r="4" fill="#ffe066"/>
    <circle cx="22" cy="410" r="18" fill="#5aad28"/>
    <circle cx="38" cy="406" r="14" fill="#6cc030"/>
    <circle cx="145" cy="408" r="16" fill="#5aad28"/>

