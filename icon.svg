    <!-- CLOUDS -->
    <g opacity="0.95">
      <ellipse cx="390" cy="72" rx="58" ry="34" fill="white"/>
      <ellipse cx="430" cy="82" rx="46" ry="28" fill="white"/>
      <ellipse cx="352" cy="82" rx="38" ry="24" fill="white"/>
      <ellipse cx="395" cy="92" rx="62" ry="22" fill="white"/>
