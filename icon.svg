    <ellipse cx="230" cy="490" rx="22" ry="10" fill="#b8a888" opacity="0.7"/>
    <ellipse cx="274" cy="490" rx="20" ry="10" fill="#c4b09a" opacity="0.7"/>
    <ellipse cx="248" cy="472" rx="20" ry="9" fill="#b0a080" opacity="0.7"/>
    <ellipse cx="290" cy="472" rx="18" ry="9" fill="#beb090" opacity="0.7"/>
    <ellipse cx="210" cy="472" rx="18" ry="9" fill="#bab090" opacity="0.7"/>
