    <rect x="86" y="328" width="14" height="58" rx="3" fill="#c8924a" stroke="#8b6038" stroke-width="2"/>
    <rect x="112" y="328" width="14" height="58" rx="3" fill="#c8924a" stroke="#8b6038" stroke-width="2"/>
