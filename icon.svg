    <rect x="430" y="165" width="22" height="48" rx="3" fill="#a07860"/>
    <rect x="426" y="162" width="30" height="8" rx="2" fill="#886650"/>
    <circle cx="441" cy="152" r="9" fill="white" opacity="0.7"/>
