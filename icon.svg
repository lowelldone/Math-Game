    <rect x="62" y="164" width="12" height="46" rx="5" fill="white" filter="url(#txtShadow)"/>
    <rect x="45" y="181" width="46" height="12" rx="5" fill="white" filter="url(#txtShadow)"/>
    <!-- x bottom-left -->
    <rect x="42" y="446" width="12" height="46" rx="5" fill="white" filter="url(#txtShadow)" transform="rotate(45 48 469)"/>
    <rect x="42" y="446" width="12" height="46" rx="5" fill="white" filter="url(#txtShadow)" transform="rotate(-45 48 469)"/>
    <!-- div right -->
    <rect x="446" y="240" width="44" height="12" rx="5" fill="white" filter="url(#txtShadow)"/>
    <circle cx="468" cy="224" r="7" fill="white" filter="url(#txtShadow)"/>
    <circle cx="468" cy="266" r="7" fill="white" filter="url(#txtShadow)"/>
    <!-- = bottom-right -->
    <rect x="443" y="442" width="46" height="11" rx="5" fill="white" filter="url(#txtShadow)"/>
    <rect x="443" y="460" width="46" height="11" rx="5" fill="white" filter="url(#txtShadow)"/>

