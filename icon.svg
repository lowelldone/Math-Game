<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="90" ry="90"/>
    </clipPath>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ecff6"/>
      <stop offset="100%" stop-color="#b8ecff"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ecb3f"/>
      <stop offset="100%" stop-color="#5aad28"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9b99a"/>
      <stop offset="100%" stop-color="#a89070"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c87c2a"/>
      <stop offset="100%" stop-color="#8b4e12"/>
    </linearGradient>
    <linearGradient id="mqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38c8ff"/>
      <stop offset="60%" stop-color="#1a8cff"/>
      <stop offset="100%" stop-color="#0055cc"/>
    </linearGradient>
    <linearGradient id="villageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#e07c00"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d060"/>
      <stop offset="100%" stop-color="#b89020"/>
    </linearGradient>
    <radialGradient id="tree1Grad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#92d44a"/>
      <stop offset="100%" stop-color="#3e8c18"/>
    </radialGradient>
    <radialGradient id="tree2Grad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7bc637"/>
      <stop offset="100%" stop-color="#336e12"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="60%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
    </radialGradient>
    <filter id="txtShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00000066"/>
    </filter>
  </defs>

