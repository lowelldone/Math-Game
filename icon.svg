    <line x1="386" y1="208" x2="413" y2="162" stroke="#c8a830" stroke-width="2" opacity="0.5"/>
    <line x1="410" y1="207" x2="428" y2="170" stroke="#c8a830" stroke-width="2" opacity="0.5"/>
