    <line x1="90" y1="350" x2="90" y2="402" stroke="#a06020" stroke-width="1.5" opacity="0.4"/>
    <line x1="420" y1="350" x2="420" y2="402" stroke="#a06020" stroke-width="1.5" opacity="0.4"/>
    <circle cx="98" cy="374" r="9" fill="#7a4810"/>
    <circle cx="98" cy="374" r="5" fill="#5a3008"/>
    <circle cx="414" cy="374" r="9" fill="#7a4810"/>
    <circle cx="414" cy="374" r="5" fill="#5a3008"/>
    <ellipse cx="108" cy="342" rx="12" ry="7" fill="#4aaa20" transform="rotate(-30 108 342)"/>
    <ellipse cx="404" cy="342" rx="12" ry="7" fill="#4aaa20" transform="rotate(30 404 342)"/>
    <ellipse cx="120" cy="338" rx="10" ry="6" fill="#5cc030" transform="rotate(-15 120 338)"/>
    <ellipse cx="392" cy="338" rx="10" ry="6" fill="#5cc030" transform="rotate(15 392 338)"/>

    <!-- "MathQuest" TITLE -->
    <text x="256" y="318"
          text-anchor="middle"
          font-family="Arial Black, Arial, sans-serif"
          font-size="86" font-weight="900"
          fill="white" stroke="white" stroke-width="14"
          stroke-linejoin="round" paint-order="stroke">MathQuest</text>
    <text x="256" y="318"
          text-anchor="middle"
          font-family="Arial Black, Arial, sans-serif"
          font-size="86" font-weight="900"
          fill="url(#mqGrad)" stroke="#003fa8" stroke-width="4"
          stroke-linejoin="round" paint-order="stroke">MathQuest</text>

    <!-- "Village" TEXT -->
    <text x="256" y="402"
          text-anchor="middle"
          font-family="Arial Black, Arial, sans-serif"
          font-size="72" font-weight="900"
          fill="white" stroke="white" stroke-width="12"
          stroke-linejoin="round" paint-order="stroke">Village</text>
    <text x="256" y="402"
          text-anchor="middle"
          font-family="Arial Black, Arial, sans-serif"
          font-size="72" font-weight="900"
          fill="url(#villageGrad)" stroke="#7a3e00" stroke-width="3"
          stroke-linejoin="round" paint-order="stroke">Village</text>
  </g>
